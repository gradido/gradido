
fragment SpaceFields on Space {
  id
  name
  description
  url
}

fragment PaginationFields on Pagination {
  total
  page
  pages
}

fragment ProjectBrandingCommonFields on ProjectBranding {
  id
  name
  alias
  description
  spaceId
  newUserToSpace
  logoUrl
}

fragment AiChatMessageFields on CreaChatMessage {
  content
  role
  threadId
  errorCode
}

fragment UserCommonFields on User {
  id
  firstName
  lastName
  alias
  salutation
  # The pair that names a member everywhere, plus the date of the picture they show -- a
  # date, not the picture. null means there is nothing to show, and this side never learns
  # why (no picture, switch off, deleted, another community).
  gradidoID
  communityUuid
  avatarUpdatedAt
  # Whether the member stands on the map of the member search, for the pin behind their name.
  # A yes or no; the place is not asked for and would not be answered.
  findableOnMap
  # For the arrow into the wallet's send form, which stands behind every other name -- but not
  # behind that of a deleted member, to whom nothing can be sent.
  deletedAt
}
