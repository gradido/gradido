#import './fragments.graphql'

query adminListContributions(
  $filter: SearchContributionsFilterArgs
  $paginated: Paginated
) {
  adminListContributions(paginated: $paginated, filter: $filter) {
    contributionCount
    contributionList {
      id
      user {
        emailContact {
          email
        }
        ...UserCommonFields
        publicName
        userIdentifier
        createdAt
      }
      amount
      memo
      creationGroups {
        tag
        name
      }
      closedAt
      closedBy
      closedByUserName
      contributionDate
      createdAt      
      updatedAt
      updatedBy 
      updatedByUserName
      contributionStatus
      messagesCount
      lastMessageType
      lastMessageByModerator
      moderatorId
      moderatorUserName
      userId
      resubmissionAt
    }
  }
}

query adminListContributionsShort(
  $filter: SearchContributionsFilterArgs
  $paginated: Paginated
) {
  adminListContributions(
    paginated: $paginated,
    filter: $filter
  ) {
    contributionCount
    contributionList {
      id
      amount
      memo
      createdAt
      contributionDate
      confirmedAt
      contributionStatus
    }
  }
}


query adminListContributionsCount(
  $filter: SearchContributionsFilterArgs
) {
  adminListContributions(
    filter: $filter
  ) {
    contributionCount
  }
}


# The open creations of the admin's start page, in one request. What waits for the moderation and
# what waits for the member are the two halves of the tab "open" of the creation page, with what
# it hides until its resubmission date. What is hidden has no filter of its own: it is all that is
# open, less the two.
query adminOpenCreationCounts {
  waitingForModeration: adminListContributions(
    filter: { statusFilter: [PENDING], hideResubmission: true }
  ) {
    contributionCount
  }
  waitingForMember: adminListContributions(
    filter: { statusFilter: [IN_PROGRESS], hideResubmission: true }
  ) {
    contributionCount
  }
  allOpen: adminListContributions(
    filter: { statusFilter: [IN_PROGRESS, PENDING], hideResubmission: false }
  ) {
    contributionCount
  }
}
