query groupTags {
  groupTags {
    id
    tag
    name
  }
}

query userGroupTags($userId: Int!) {
  userGroupTags(userId: $userId) {
    id
    tag
    name
  }
}

query moderatorGroupScope($userId: Int!) {
  moderatorGroupScope(userId: $userId)
}

mutation setUserGroupTags($userId: Int!, $tags: [String!]!) {
  setUserGroupTags(userId: $userId, tags: $tags) {
    id
    tag
    name
  }
}

mutation setModeratorGroupScope($userId: Int!, $scope: [String!]!) {
  setModeratorGroupScope(userId: $userId, scope: $scope)
}

mutation createGroupTag($tag: String!, $name: String) {
  createGroupTag(tag: $tag, name: $name) {
    id
    tag
    name
  }
}

mutation updateGroupTag($id: Int!, $tag: String, $name: String) {
  updateGroupTag(id: $id, tag: $tag, name: $name) {
    id
    tag
    name
  }
}

# Move a contribution to another group (or to none). Only while it is still open;
# the backend refuses once it is confirmed, denied or deleted.
mutation assignContributionGroupTags($contributionId: Int!, $tags: [String!]!) {
  assignContributionGroupTags(contributionId: $contributionId, tags: $tags)
}
