# AI-GENERATED — not an architecture reference

# The support requests of a tab, a page of them, with the member in the shape the creation page's
# rows have -- without the address, which stands beside the member (userEmail): User.emailContact
# asks the database again where no address is in force, and fails there for the whole page.
query adminListSupportTickets($statuses: [SupportTicketStatus!]!, $currentPage: Int!, $pageSize: Int!) {
  adminListSupportTickets(statuses: $statuses, currentPage: $currentPage, pageSize: $pageSize) {
    count
    tickets {
      id
      userId
      user {
        id
        firstName
        lastName
        alias
        gradidoID
        communityUuid
        avatarUpdatedAt
        findableOnMap
        deletedAt
        publicName
        userIdentifier
        createdAt
      }
      userEmail
      text
      status
      creationGroupTag
      creationGroupName
      createdAt
      closedAt
      closedBy
      closedByUserName
      lastMessageType
      lastMessageByModerator
    }
  }
}

# An opened request: its thread, the notes among it, and the moderation's remark on its member --
# one round trip, as for an opened contribution (adminListContributionMessages.ts).
query adminListSupportTicketMessages($supportTicketId: Int!, $userId: Int!) {
  userRemark(userId: $userId) {
    remark
    updatedAt
    updatedByName
  }
  adminListSupportTicketMessages(supportTicketId: $supportTicketId) {
    id
    message
    createdAt
    type
    userAlias
    userId
    userAvatarColorIndex
    userGradidoID
    userCommunityUuid
    userAvatarUpdatedAt
    isModerator
  }
}

# The two halves of the open tab within the moderator's groups (K3): what the badges in the bar
# and on the tab, and the start page, add up. A document of its own: the start page asks for it
# beside the creation's counts, and either may fail without the other.
query adminCountOpenSupportTickets {
  adminCountOpenSupportTickets {
    forModeration
    forMember
  }
}

# An answer to the member, an answer that closes the request, or a note for the moderation
# (K3). The page reads only that it went through; the thread is asked for anew.
mutation adminCreateSupportTicketMessage(
  $supportTicketId: Int!
  $message: String!
  $type: SupportTicketMessageType!
  $close: Boolean!
) {
  adminCreateSupportTicketMessage(
    supportTicketId: $supportTicketId
    message: $message
    type: $type
    close: $close
  ) {
    id
  }
}

# The tick of a row: closed without a message and without a mail (SUA-010, SUA-018).
mutation adminCloseSupportTicket($supportTicketId: Int!) {
  adminCloseSupportTicket(supportTicketId: $supportTicketId)
}

# Deleted softly, without a message and without a mail (SUA-018).
mutation adminDeleteSupportTicket($supportTicketId: Int!) {
  adminDeleteSupportTicket(supportTicketId: $supportTicketId)
}
