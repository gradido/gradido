<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

  <title>Gradido Admin Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Light or dark before the first paint, from the setting the wallet keeps on this device
    // ('system' | 'light' | 'dark'; missing or unknown is 'system'), so that a dark device sees
    // no light flash. On the root element: color-scheme has to reach it, and the windows hung on
    // the body sit below it. In the dark the window's bar too: as an installed app the admin runs
    // in the wallet's window, whose bar would otherwise keep the wallet's light. Its colour is
    // DARK_BAR_COLOUR there; src/composables/useTheme.ts follows every change after this.
    ;(function () {
      var mode = null
      try {
        mode = window.localStorage.getItem('gradido-theme-mode')
      } catch (e) {
        // A private window may refuse the storage: then the system decides, as in useTheme.ts.
      }
      if (mode !== 'light' && mode !== 'dark') mode = 'system'
      if (
        mode === 'dark' ||
        (mode === 'system' &&
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.setAttribute('data-bs-theme', 'dark')
        var bar = document.createElement('meta')
        bar.name = 'theme-color'
        bar.content = '#17181a'
        document.head.appendChild(bar)
      }
    })()
  </script>
</head>
<body>
<div class="wrapper" id="app"></div>
<script type="module" src="/src/main.ts"></script>
<!-- built files will be auto injected -->

</body>
</html>
