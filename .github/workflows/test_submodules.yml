name: Gradido Submodules Test CI

on:
  push:
    paths:
      - 'core/**'
      - 'config-schema/**'
      - 'database/**'
      - 'shared/**'
      - 'shared-native/**'
      - 'docker-compose.*'
      - '.bun-version'
      - '.nvmrc'
      - '.github/workflows/test_submodules.yml'

jobs:
  build-windows:
    name: Build Windows - Submodules
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: install node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc' 
        
      # c-cpp-zig-build keeps the Zig toolchain and the packages fetched from build.zig.zon
      # here. The key moves with the c-cpp-zig-build version (package.json) and the pinned
      # packages (build.zig.zon), so this hits on virtually every run.
      - name: Cache Zig toolchain & packages
        uses: actions/cache@v4
        with:
          path: ~/.zig-build
          key: zig-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/package.json', 'shared-native/build.zig.zon') }}

      # Zig's local build cache: the compiled objects of the addon and of the packages it
      # links. Zig's cache is content-addressed - restoring an outdated one
      # via restore-keys is safe and turns a cold build into an incremental one.
      # runner.os/arch are part of the key because shared_native.node is platform-specific.
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: shared-native/.zig-cache
          key: zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/build.zig', 'shared-native/build.zig.zon', 'shared-native/napi/**') }}
          restore-keys: |
            zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: install bun 
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: install dependencies
        run: |
          bun install --filter shared --frozen-lockfile
          bun install --global turbo@^2

      - name: test shared and shared-native
        run: turbo shared#test shared-native#test
      - name: test with node js test runner and therefore windows napi nodejs addon
        run: turbo shared-native#test:node
  
  build:
    name: Unit Tests & Typecheck & Build - Submodules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: install node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc' 
        
      # c-cpp-zig-build keeps the Zig toolchain and the packages fetched from build.zig.zon
      # here. The key moves with the c-cpp-zig-build version (package.json) and the pinned
      # packages (build.zig.zon), so this hits on virtually every run.
      - name: Cache Zig toolchain & packages
        uses: actions/cache@v4
        with:
          path: ~/.zig-build
          key: zig-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/package.json', 'shared-native/build.zig.zon') }}

      # Zig's local build cache: the compiled objects of the addon and of the packages it
      # links. Zig's cache is content-addressed - restoring an outdated one
      # via restore-keys is safe and turns a cold build into an incremental one.
      # runner.os/arch are part of the key because shared_native.node is platform-specific.
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: shared-native/.zig-cache
          key: zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/build.zig', 'shared-native/build.zig.zon', 'shared-native/napi/**') }}
          restore-keys: |
            zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: install bun 
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Database & redis for tests using database and/or redis-semaphore
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --detach mariadb redis

      - name: install dependencies
        run: |
          bun install --filter core --frozen-lockfile
          bun install --global turbo@^2

      - name: test shared-native
        run: turbo shared-native#test
      - name: typecheck, locales && unit test
        run: turbo core#typecheck core#locales database#test database#typecheck shared#test shared#typecheck shared-native#test config-schema#test config-schema#typecheck
      - name: core test extra
        run: turbo core#test
      - name: test with node js test runner and therefore napi nodejs addon
        run: turbo shared-native#test:node

