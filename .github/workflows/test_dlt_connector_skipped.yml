# Companion to test_dlt_connector.yml. Do not run anything here - this workflow exists purely
# so that the check names below get reported when test_dlt_connector.yml does NOT run.
#
# Why: a required status check that is never reported stays "Expected - waiting for
# status" forever and blocks the merge. test_dlt_connector.yml is path-filtered, so on an
# unrelated change it never starts and never reports. The paths-ignore list here is
# the exact mirror of the paths list in test_dlt_connector.yml and MUST be kept in sync with it.
#
# Caveat: paths and paths-ignore are not strict complements. A push that touches both
# a filtered and an unfiltered file starts BOTH workflows, and both report the same
# check names. See the note in the PR description before relying on this.

name: Gradido DLT Connector Test CI (skipped)

on:
  push:
    paths-ignore:
      - 'dlt-connector/**'
      - 'docker-compose.*'
      - '.bun-version'
      - '.github/workflows/test_dlt_connector.yml'

jobs:
  build:
    name: Docker Build Test - DLT Connector
    runs-on: ubuntu-latest
    steps:
      - run: echo "test_dlt_connector.yml not affected by this change - reporting success so the required check does not hang."

  unit_test:
    name: Unit Tests & Typecheck & Build - DLT Connector
    runs-on: ubuntu-latest
    steps:
      - run: echo "test_dlt_connector.yml not affected by this change - reporting success so the required check does not hang."
