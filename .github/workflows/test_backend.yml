name: Gradido Backend Test CI

on:
  push:
    paths:
      - 'backend/**'
      - 'config-schema/**'
      - 'core/**'
      - 'database/**'
      - 'shared/**'
      - 'shared-native/**'
      - 'admin/src/graphql/**'
      - 'frontend/src/graphql/**'
      - 'docker-compose.*'
      - '.bun-version'
      - '.nvmrc'
      - '.github/workflows/test_backend.yml'

jobs:
  build_test:
    name: Docker Build Test - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Backend | Build 'test' image
        run: docker build -f ./backend/Dockerfile --target production -t "gradido/backend:production" .

  unit_test:
    name: Unit tests & Typecheck & Build - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
            
      - name: docker-compose mariadb redis
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --detach --no-deps mariadb redis

      # c-cpp-zig-build keeps the Zig toolchain and the packages fetched from build.zig.zon
      # here. The key moves with the c-cpp-zig-build version (package.json) and the pinned
      # packages (build.zig.zon), so this hits on virtually every run.
      - name: Cache Zig toolchain & packages
        uses: actions/cache@v4
        with:
          path: ~/.zig-build
          key: zig-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/package.json', 'shared-native/build.zig.zon') }}

      # Zig's local build cache: the compiled objects of the addon and of the packages it
      # links. Zig's cache is content-addressed - restoring an outdated one
      # via restore-keys is safe and turns a cold build into an incremental one.
      # runner.os/arch are part of the key because shared_native.node is platform-specific.
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: shared-native/.zig-cache
          key: zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/build.zig', 'shared-native/build.zig.zon', 'shared-native/napi/**') }}
          restore-keys: |
            zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: install bun 
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: install dependencies
        run: |
          bun install --filter backend --filter core --frozen-lockfile
          bun install --global --no-save turbo@^2
      
      - name: Backend | Build
        run: turbo backend#build

      - name: Backend | Unit tests
        run: turbo backend#test backend#typecheck
