name: Gradido Federation Test CI

on:
  push:
    paths:
      - 'federation/**'
      - 'config-schema/**'
      - 'database/**'
      - 'core/**'
      - 'shared/**'
      - 'shared-native/**'
      - 'docker-compose.*'
      - '.bun-version'
      - '.nvmrc'
      - '.github/workflows/test_federation.yml'

jobs:
  build:
    name: Docker Build Test - Federation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build `test` image
        run: docker build --target production -t "gradido/federation:production" -f federation/Dockerfile .

  unit_test:
    name: Unit Tests & Typecheck & Build - Federation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
            
      - name: docker-compose mariadb redis
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --detach --no-deps mariadb redis
    
      # The Zig toolchain and the Node headers are pure downloads: the key only moves
      # when ZIG_VERSION or .nvmrc does, so this hits on virtually every run.
      - name: Cache Zig toolchain & node headers
        uses: actions/cache@v4
        with:
          path: ~/.zig-build
          key: zig-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/build_helper/const.ts', '.nvmrc') }}

      # shared-native/build.ts points both ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR
      # here, so this one directory holds the compiled objects and the packages fetched
      # from build.zig.zon. Zig's cache is content-addressed - restoring an outdated one
      # via restore-keys is safe and turns a cold build into an incremental one.
      # runner.os/arch are part of the key because shared_native.node is platform-specific.
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: shared-native/.zig-cache
          key: zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shared-native/build.zig', 'shared-native/build_napi.zig', 'shared-native/build.zig.zon', 'shared-native/src/**', 'shared-native/include/**', 'shared-native/third_party/**') }}
          restore-keys: |
            zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: install bun 
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: install dependencies
        run: |
          bun install --filter federation --frozen-lockfile
          bun install --global --no-save turbo@^2

      - name: Federation | Build
        run: turbo federation#build

      - name: Federation | Unit tests
        id: test
        run: turbo federation#test federation#typecheck
