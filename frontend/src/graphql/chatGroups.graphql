# AI-GENERATED — not an architecture reference

# A chat group (P5) as one of its members sees it: its name, where it lives and who opened it,
# the member's own part in it -- role, mute mark, since when --, how many are in it, what waits
# unread for them and when the latest message arrived.
#
# ⛔ The fields the backend's seeds ask for (backend/src/seeds/graphql/queries.ts, `chatGroups`),
# and `documents.test.ts` holds this document against the schema. `role` comes as the enum NAME
# (OWNER, MODERATOR, MEMBER). `createdBy` is null where the opener's users row is gone.
#
# A fragment, because the list and the answers of the changes that return a group (anlegen,
# aufnehmen, umbenennen) feed the same window: a field asked for in one and forgotten in another
# would leave the window drawing the group differently depending on where it came from.
fragment chatGroupFields on ChatGroup {
  groupUuid
  conversationId
  title
  communityName
  createdBy {
    communityUuid
    gradidoID
    alias
  }
  createdAt
  role
  joinedAt
  mutedByMe
  memberCount
  unreadMessages
  lastMessageAt
}

# The member's groups in the server's order: newest activity first -- the latest message, or the
# opening of a group without one (dbSelectChatGroupsByMember). ⛔ No variables, so one cache key
# for whoever is signed in: asked with `network-only` wherever it is shown, and the cache is
# emptied at logout.
query chatGroupsQuery {
  chatGroups {
    ...chatGroupFields
  }
}

# One message of a group's thread (P5): what a message of the thread with one person carries, and
# who wrote it -- `senderUser`, the same `User` shape the contact list carries (alias, colour digit,
# the date of the picture; no real name, NU-019), null where the writer's users row is gone -- and
# whether it went out as an announcement (`announcement`), which every member reads. `groupUuid` is
# this group's. `deliveryState`, `notify` and `mailState` are filled on one's OWN messages only, as
# in the thread with one person; `mailState` stays null in a group (P5a: one value per row fits
# one recipient).
#
# ⛔ The chat's beat (newChatMessagesSince, chat.graphql) hands arrivals into this list, so it asks
# for every one of these fields -- `chatMessageFields.spec.js` holds the two together.
fragment chatGroupMessageFields on ChatMessage {
  id
  messageUuid
  conversationId
  groupUuid
  sender {
    communityUuid
    gradidoID
  }
  senderUser {
    communityUuid
    gradidoID
    alias
    avatarColorIndex
    avatarUpdatedAt
  }
  announcement
  mine
  subject
  body
  createdAt
  editedAt
  deliveryState
  notify
  mailState
  images {
    imageUuid
    width
    height
  }
  forwarded
  forwardedFrom {
    communityUuid
    gradidoID
    alias
  }
}

# A group's thread, one page at a time, oldest first within the page (E-018), as the thread with
# one person is asked -- by the group's uuid instead of the pair. `before` is the smallest id on
# screen; `limit` defaults to 50, and more than 100 is refused. `mutedByMe` is the member's own mark on the
# group. A member who is not in the group (any longer) gets CHAT_GROUP_NOT_FOUND, the same answer as
# for a group that does not exist.
query chatGroupMessagesQuery($groupUuid: String!, $before: Int, $limit: Int) {
  chatGroupMessages(groupUuid: $groupUuid, before: $before, limit: $limit) {
    hasMore
    mutedByMe
    messages {
      ...chatGroupMessageFields
    }
  }
}

# Writes one message to the group, and answers with one's OWN copy -- a message of the thread as it
# stands. `announce`: as an announcement by mail to every member but the sender who has not muted
# the group; only the owner and the moderators (E-050 F5), for anybody else it is
# CHAT_MESSAGE_NOT_SENT: NOT_ALLOWED and nothing is filed. The copy says what was asked for, never
# who got a mail (E-024).
#
# ⛔ The variables are called `$body` and `$image` -- the names the backend's request log masks
# (LOG-071): under any other name the text and some 44,000 characters of a picture would be written
# to the log with every message.
mutation sendChatGroupMessage(
  $groupUuid: String!
  $body: String!
  $announce: Boolean!
  $image: ChatImageInput
) {
  sendChatGroupMessage(groupUuid: $groupUuid, body: $body, announce: $announce, image: $image) {
    ...chatGroupMessageFields
  }
}

# Moves one's OWN read pointer in the group up to the highest id the thread has shown (E-017). The
# server never moves it back and takes only an id of this group.
mutation markChatGroupRead($groupUuid: String!, $upToMessageId: Int!) {
  markChatGroupRead(groupUuid: $groupUuid, upToMessageId: $upToMessageId)
}

# Mutes the group for oneself, or lifts it (E-024): no announcement reaches one by mail while it is
# muted; the thread shows every message as before. Only one's own row -- nobody is told.
mutation setChatGroupMuted($groupUuid: String!, $muted: Boolean!) {
  setChatGroupMuted(groupUuid: $groupUuid, muted: $muted)
}

# The members of a group (P5), the longest-standing first, as the other members see them: the same
# `User` shape the contact list carries -- alias, community, colour digit, the date of the picture,
# no real name (NU-019) --, their part and since when. ⛔ Nothing about their mute mark or their
# read pointer: those are each member's own (E-024, E-008). CHAT_GROUP_NOT_FOUND for somebody who
# is not in the group.
query chatGroupMembersQuery($groupUuid: String!) {
  chatGroupMembers(groupUuid: $groupUuid) {
    user {
      communityUuid
      communityName
      gradidoID
      alias
      avatarColorIndex
      avatarUpdatedAt
    }
    role
    joinedAt
  }
}

# Opens a group (P5): the member who opens it is its owner, the members named are taken in -- only
# the member's own contacts of this community (E-049, E-050 F2; the server checks it) -- and each
# of them gets the mail "Du bist jetzt in der Gruppe". Refused as CHAT_GROUP_NOT_CREATED: TITLE |
# OTHER_COMMUNITY | NOT_A_CONTACT | UNKNOWN_MEMBER | FULL, and then nothing is opened.
#
# ⛔ The name goes as `$title` -- the name the backend's request log masks.
mutation createChatGroup($title: String!, $members: [MemberAvatarRefInput!]!) {
  createChatGroup(title: $title, members: $members) {
    ...chatGroupFields
  }
}

# Takes the members named into the group -- the owner's and the moderators' (E-050 F4) -- each with
# the mail "Du bist jetzt in der Gruppe". CHAT_GROUP_NOT_CHANGED: NOT_ALLOWED | OTHER_COMMUNITY |
# NOT_A_CONTACT | UNKNOWN_MEMBER | FULL.
mutation addChatGroupMembers($groupUuid: String!, $members: [MemberAvatarRefInput!]!) {
  addChatGroupMembers(groupUuid: $groupUuid, members: $members) {
    ...chatGroupFields
  }
}

# Takes one member out: the owner anybody, a moderator a plain member (E-050 F4). Their messages
# stay in the thread. CHAT_GROUP_NOT_CHANGED: NOT_ALLOWED | NOT_A_MEMBER.
mutation removeChatGroupMember($groupUuid: String!, $member: MemberAvatarRefInput!) {
  removeChatGroupMember(groupUuid: $groupUuid, member: $member)
}

# The member leaves the group. An owner who leaves hands it on: to the longest-standing moderator,
# else to the longest-standing member.
mutation leaveChatGroup($groupUuid: String!) {
  leaveChatGroup(groupUuid: $groupUuid)
}

# Makes a member a moderator, or takes it back -- the owner's only, at most two moderators
# (E-050 F4). CHAT_GROUP_NOT_CHANGED: NOT_ALLOWED | NOT_A_MEMBER | TOO_MANY_MODERATORS.
mutation setChatGroupModerator(
  $groupUuid: String!
  $member: MemberAvatarRefInput!
  $moderator: Boolean!
) {
  setChatGroupModerator(groupUuid: $groupUuid, member: $member, moderator: $moderator)
}

# Renames the group -- the owner's and the moderators'. CHAT_GROUP_NOT_CHANGED: NOT_ALLOWED | TITLE.
# ⛔ `$title`, for the request log's mask, as above.
mutation renameChatGroup($groupUuid: String!, $title: String!) {
  renameChatGroup(groupUuid: $groupUuid, title: $title) {
    ...chatGroupFields
  }
}
