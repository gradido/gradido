fragment balanceFields on Balance {
  balance
  balanceGDT
  count
  linkCount
  openLinkCount
}

fragment transactionFields on Transaction {
  id
  typeId
  amount
  balance
  previousBalance
  balanceDate
  memo
  linkedUser {
    # No firstName/lastName: for members they are always null now (NU-019), and for a
    # moderator reading their own list they would be real names sitting in a browser
    # cache for no screen to show. The row reads by alias, the circle by the digit below.
    communityUuid
    communityName
    gradidoID
    alias
    # The circle colour as a finished digit, computed by the server from the real
    # initials (NU-017). It is what keeps every circle the colour it always was once
    # firstName and lastName stop being delivered for other members -- the colour rule
    # itself must not move to the alias (AS-010).
    avatarColorIndex
    # When this member last changed the picture other members may see -- a date, not the
    # picture. Both live queries share this fragment, so it is asked for once here rather
    # than in each of them, the way balanceFields is.
    #
    # null means there is nothing to show, for whatever reason, and that is the whole
    # answer the screen needs. It is also what tells the wallet to drop a picture it still
    # holds for this member: see composables/useMemberAvatars.
    avatarUpdatedAt
  }
  decay {
    decay
    start
    end
    duration
  }
  linkId
  # Paid with a printed thank you card. The name comes only with the payer's own row --
  # the backend decides that, not the screen. See Transaction.thankYouCardLabel.
  viaThankYouCard
  thankYouCardLabel
}

# The booking list itself, one page at a time (Transactions.vue). `counterparty` narrows it
# to the bookings shared with one member -- what the contact window links to; null asks for
# the whole account. The layout's query below takes no such argument on purpose: the column
# beside the overview shows the member's newest bookings, and those can never be narrowed.
query transactionsQuery(
  $currentPage: Int = 1
  $pageSize: Int = 25
  $order: Order = DESC
  $counterparty: MemberAvatarRefInput = null
) {
  transactionList(
    currentPage: $currentPage
    pageSize: $pageSize
    order: $order
    counterparty: $counterparty
  ) {
    balance {
      ...balanceFields
    }
    transactions {
      ...transactionFields
    }
  }
}

query transactionsUserCountQuery($currentPage: Int = 1, $pageSize: Int = 25, $order: Order = DESC) {
  transactionList(currentPage: $currentPage, pageSize: $pageSize, order: $order) {
    balance {
      ...balanceFields
    }
    transactions {
      ...transactionFields
    }
  }
  communityStatistics {
    totalUsers
  }
}