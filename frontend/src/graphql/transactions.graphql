fragment balanceFields on Balance {
  balance
  balanceGDT
  count
  linkCount
  openLinkCount
}

fragment transactionFields on Transaction {
  id
  typeId
  amount
  balance
  previousBalance
  balanceDate
  memo
  linkedUser {
    firstName
    lastName
    communityUuid
    communityName
    gradidoID
    alias
  }
  decay {
    decay
    start
    end
    duration
  }
  linkId
  # Paid with a printed thank you card. The name comes only with the payer's own row --
  # the backend decides that, not the screen. See Transaction.thankYouCardLabel.
  viaThankYouCard
  thankYouCardLabel
}

query transactionsQuery($currentPage: Int = 1, $pageSize: Int = 25, $order: Order = DESC) {
  transactionList(currentPage: $currentPage, pageSize: $pageSize, order: $order) {
    balance {
      ...balanceFields
    }
    transactions {
      ...transactionFields
    }
  }
}

query transactionsUserCountQuery($currentPage: Int = 1, $pageSize: Int = 25, $order: Order = DESC) {
  transactionList(currentPage: $currentPage, pageSize: $pageSize, order: $order) {
    balance {
      ...balanceFields
    }
    transactions {
      ...transactionFields
    }
  }
  communityStatistics {
    totalUsers
  }
}