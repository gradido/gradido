# AI-GENERATED — not an architecture reference

# A message as every document here asks for it: ONE shape, wherever a message comes from -- a page
# of the thread, the beat, one's own copy, a changed message. The beat's arrivals and changes and
# one's own copies go into the page of a thread, and a field missing from one of them would leave
# a hole in it. A group's messages have the same shape (`chatGroupMessageFields`, chatGroups.graphql);
# `chatMessageFields.spec.js` holds the two against each other.
#
# `editedAt` (E-060): when its writer changed the text last, null for a message nobody changed --
# for both sides; the bubble says "bearbeitet" beside the time.
fragment chatMessageFields on ChatMessage {
  id
  messageUuid
  conversationId
  groupUuid
  sender {
    communityUuid
    gradidoID
  }
  senderUser {
    communityUuid
    gradidoID
    alias
    avatarColorIndex
    avatarUpdatedAt
  }
  announcement
  mine
  subject
  body
  createdAt
  editedAt
  deliveryState
  notify
  mailState
  images {
    imageUuid
    width
    height
  }
  forwarded
  forwardedFrom {
    communityUuid
    gradidoID
    alias
  }
}

# The thread with one person, one page at a time, oldest first within the page (E-018: the
# order of arrival on this server; nothing is sorted). The person is named by the PAIR the
# contact window holds (KF-004) -- there is no conversation id to ask by, and none is needed.
#
# `before` is the smallest id already on screen: the page it returns lies right before it.
# Without it, the newest page. `limit` defaults to 50 on the server and stops at 100.
#
# ⛔ The fields are the ones the backend's seeds ask for, one for one -- this query's in
# backend/src/seeds/graphql/queries.ts, the two mutations' below in mutations.ts -- and
# `documents.test.ts` holds this document against the schema. `deliveryState`, `notify` and
# `mailState` come back only on one's OWN messages, as the enum NAMES (DELIVERED, PENDING,
# FAILED; EMAIL, NONE; MAILED, MUTED) -- on the other side's messages they are null, because
# the server says nothing about how the other side's mail went.
#
# `mailState` is what became of the mail about one's own message (E-034): MAILED where one went
# out, MUTED where one was asked for and the recipient has muted the conversation. Null where
# none was asked for -- and where nothing is known: a message from before the field, a recipient
# server from before it, a mail that did not go out, a delivery that failed.
#
# `mutedByMe` is one's OWN mark on this conversation (E-024): no mails about the other
# person's messages while it is set; false where there is no conversation yet. It comes
# with the thread, so the bell needs no question of its own (E-017: one question on
# opening).
#
# `images` (P7): the picture a message carries, named -- what to fetch it by (the server's
# chatMessageImage) and its size, which the bubble takes its room from before it has come. Never
# the picture itself: a page of fifty messages with pictures would carry more than a megabyte.
# Empty for a message without one.
#
# `groupUuid`, `senderUser`, `announcement` (P5): null, null and false in a conversation of two --
# asked all the same, so that every document of a message asks the one shape a group's message has
# too (`chatGroupMessageFields`, chatGroups.graphql): the beat's arrivals go into either thread.
query chatMessagesWithMemberQuery($ref: MemberAvatarRefInput!, $before: Int, $limit: Int) {
  chatMessagesWithMember(ref: $ref, before: $before, limit: $limit) {
    hasMore
    mutedByMe
    messages {
      ...chatMessageFields
    }
  }
}

# What is new for me since a message id, in ALL my conversations at once -- the one question the
# wallet asks in its beat (E-017; useChatUpdates). The browser sorts the messages into the
# threads that are open; nothing else keeps them.
#
# Without `afterId` the answer only says where one stands: no messages, `latestId` the highest id
# of one's own conversations, and how many conversations hold something unread. With it, the
# messages above that id, ascending, one's own included (`mine`), deleted ones left out; `limit`
# defaults to 50 on the server and stops at 100. `latestId` is where the next question goes on
# from -- under `hasMore` the last message delivered, not the highest. `unreadConversations`
# counts conversations, not messages, and a muted one still counts (E-024).
#
# ⚠️ A known limit, accepted (P4a, #3977): two messages written at the same moment can become
# visible in the reverse order of their ids, and then the marker passes over the older one. It
# is still in the thread (`chatMessagesWithMember`) and shows there on the next opening. The
# threads drop a message whose id they already hold, so an answer that brings one twice does
# no harm.
#
# The fields of `messages` are the ones of a message of the thread with one person AND of a
# group's thread (`chatGroupMessageFields`, chatGroups.graphql), one for one: an arrival is hung
# into either list and drawn by the same bubble, and a field missing here would leave a hole in
# the list it lands in. `chatMessageFields.spec.js` holds the documents against each other.
#
# `groupUuid` (P5): the group a message was written in, null in a conversation of two. ⛔ It is
# what keeps a group's message out of the thread with its writer: an empty thread with a person
# takes its conversation from the first message that person writes, and without it a message they
# wrote in a group would be taken for one (build plan P5, Falle 1).
#
# `edited` (E-060): the messages whose text was changed since `editedCursor`, as they stand now --
# for a thread that holds one to put the new text in its place. `editedCursor` in the answer is
# what the next question hands back, as it came: what it names is the server's own. Without it the
# answer brings no changed messages and only says where to go on from, as `latestId` does without
# `afterId`. ⚠️ A changed message can come twice: the server goes a few seconds back each time, so
# that a change committed a moment late is not passed over. The same message with the same text.
query newChatMessagesSince($afterId: Int, $limit: Int, $editedCursor: String) {
  newChatMessagesSince(afterId: $afterId, limit: $limit, editedCursor: $editedCursor) {
    latestId
    unreadConversations
    hasMore
    messages {
      ...chatMessageFields
    }
    edited {
      ...chatMessageFields
    }
    editedCursor
  }
}

# Moves one's OWN read pointer up to the highest id the thread has shown (E-017). The server
# never moves it back and takes only an id of this conversation.
mutation markChatConversationRead($ref: MemberAvatarRefInput!, $upToMessageId: Int!) {
  markChatConversationRead(ref: $ref, upToMessageId: $upToMessageId)
}

# Writes one message to the person named by the pair, and answers with one's OWN copy -- the
# same fields a message of the thread has, so the answer is a bubble as it stands.
#
# `notify` is the sender's wish, and it is required: EMAIL where the box is ticked, NONE where
# it is not. The server decides the rest (E-024): the first message of a pair goes out as a
# mail whatever was asked, and a recipient who muted the conversation gets none -- the copy says
# which it was in `mailState` (E-034). A delivery that failed across the border is NOT an
# error -- the copy comes back with `deliveryState` FAILED (E-019). An error is one of
# CHAT_MESSAGE_NOT_SENT: TO_ONESELF | UNKNOWN_RECIPIENT | NO_WAY_TO_DELIVER | NOT_STORED, and
# nothing was sent.
#
# `image` (P7): one picture with the message, the JPEG as base64 and its size in whole pixels
# (utils/chatImage); with it the text may be empty. ⛔ The variable is called `$image` -- the name
# the backend's request log masks (LOG-071). Refused as CHAT_IMAGE_NOT_ACCEPTED: EMPTY | TOO_LARGE |
# NOT_JPEG | SIZE, or, to another community, CHAT_MESSAGE_NOT_SENT: TOO_LARGE_ACROSS_BORDER (the
# text is too long to go with it). `images` on the copy names the picture as it was filed.
mutation sendChatMessage(
  $ref: MemberAvatarRefInput!
  $body: String!
  $notify: ChatMessageNotify!
  $image: ChatImageInput
) {
  sendChatMessage(ref: $ref, body: $body, notify: $notify, image: $image) {
    ...chatMessageFields
  }
}

# Mutes the conversation with the person named by the pair for oneself, or lifts it (E-024):
# no mails about their chat messages while it is muted -- a letter from the form "send an
# e-mail" still goes out (E-034, A3) -- and the thread shows them as before. Only one's own
# row. The other side is not told when it is switched; it learns of it only where it asks for
# a mail, from `mailState` MUTED on its own message. False where there is no conversation yet.
mutation setChatConversationMuted($ref: MemberAvatarRefInput!, $muted: Boolean!) {
  setChatConversationMuted(ref: $ref, muted: $muted)
}

# A fresh video room for a call (V2): on one of the Jitsi servers that passed the server's last
# check, with who runs it -- `operator` as the server's list names them, null where it names
# nobody, and then `host` is what the invitation names. The contact window sends `url` to the
# person as an ordinary chat message (sendChatMessage above). The fields are the ones the
# backend's seed asks for (backend/src/seeds/graphql/queries.ts).
#
# `serverId` (V5): the server the member chose, an `id` of chatVideoServerChoices below; left out,
# one of the servers that answer, at random. A chosen server no longer to be had is
# CHAT_VIDEO_SERVER_UNAVAILABLE -- the server hands out no other in its place.
#
# ⛔ EVERY call hands out another room -- so it is always asked with `fetchPolicy: 'no-cache'`.
# The cache keys an answer by query and variables; a second call with the same (or none) would be
# answered out of the cache with the first room, and two conversations would share one.
#
# ⛔ The address is the call's secret: whoever has it can join. It goes into the message and into
# the window that opens the room -- into no log and no store (the vuex store is written whole
# into localStorage).
#
# CHAT_VIDEO_NO_SERVER where no server passed the last check, or the first check after the
# server started is not through yet.
query chatVideoRoom($serverId: Int) {
  chatVideoRoom(serverId: $serverId) {
    url
    host
    operator
  }
}

# The picture of a chat message (P7), as base64, by the uuid a message names it by (`images`
# above): only for a member of its conversation, while its message is not deleted -- null for
# everything else, with nothing that tells those apart. One picture a call; the server serves ten
# per HTTP request, and every query here is a request of its own.
#
# ⛔ Always asked with `fetchPolicy: 'no-cache'` (useChatImages): the cache would keep every picture
# as some 44,000 characters of base64 for the life of the tab. The pictures are kept as bytes, in
# memory, and let go at logout.
query chatMessageImage($imageUuid: String!) {
  chatMessageImage(imageUuid: $imageUuid)
}

# The servers a member may choose for a call (V5): those chatVideoRoom hands rooms out on right
# now -- ticked in the admin page's list and passed the last check --, in the list's order. The
# same list for everybody, but not for long: a check every ten minutes may take a server out, so
# it is asked with `fetchPolicy: 'network-only'` whenever the choice is shown.
query chatVideoServerChoices {
  chatVideoServerChoices {
    id
    host
    operator
  }
}

# A message forwarded into other conversations (Bernd, 30.09.2026, E-059): groups the member is in
# and members of this community, five at most together; the member's own words, which follow every
# copy as a message of their own; and the box "Auch per E-Mail" for the members (the first message
# of a pair goes by mail in any case). The copies come back -- the wallet counts them against the
# conversations it named; the threads they land in get them on the beat. Refused before anything is
# filed as CHAT_MESSAGE_NOT_FORWARDED: TARGETS | UNKNOWN_MESSAGE | UNKNOWN_GROUP | TO_ONESELF |
# OTHER_COMMUNITY | UNKNOWN_RECIPIENT.
mutation forwardChatMessage(
  $messageUuid: String!
  $groupUuids: [String!]!
  $members: [MemberAvatarRefInput!]!
  $words: String
  $alsoByEmail: Boolean!
) {
  forwardChatMessage(
    messageUuid: $messageUuid
    groupUuids: $groupUuids
    members: $members
    words: $words
    alsoByEmail: $alsoByEmail
  ) {
    id
    messageUuid
  }
}

# Gives a message of one's own another text (Bernd, 01.10.2026, E-060) and answers with one's copy
# as it stands then -- the shape of every message, so it takes the old one's place in the thread
# as it is. The subject of a letter and a picture stay; of a message with a picture the caption
# changes, and may be emptied. No mail goes out.
#
# ⛔ The variable is called `$body` -- the name the backend's request log masks, as for a message
# being sent.
#
# Refused as CHAT_MESSAGE_NOT_EDITED, and nothing changes: UNKNOWN_MESSAGE | NOT_OWN | FORWARDED |
# EMPTY | OTHER_COMMUNITY (a group with members elsewhere) | NOT_STORED. To a member of another
# community the change goes to their server first, and counts only once that server has taken it:
# NO_WAY_TO_DELIVER | NOT_CONFIRMED where it did not, PENDING for a message still on its way there.
mutation editChatMessage($messageUuid: String!, $body: String!) {
  editChatMessage(messageUuid: $messageUuid, body: $body) {
    ...chatMessageFields
  }
}
