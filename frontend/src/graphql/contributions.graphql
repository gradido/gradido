#import './user.graphql'

fragment unconfirmedContributionFields on Contribution {
  id
  amount
  memo
  contributionDate
  contributionStatus
  messagesCount
}

fragment contributionFields on Contribution {
  ...unconfirmedContributionFields
  createdAt
  confirmedAt
  confirmedBy
  deniedAt
  deniedBy
  updatedBy
  updatedAt
}

fragment contributionMessageFields on ContributionMessage {
  id
  message
  createdAt
  updatedAt
  type
  userFirstName
  userLastName
  userId
}

query listContributions ($pagination: Paginated!, $filter: ContributionFilterArgs) {
  listContributions(pagination: $pagination, filter: $filter) {
    contributionCount
    contributionList {
      id
      amount
      memo
      creationGroups {
        tag
        name
      }
      contributionDate
      contributionStatus
      messagesCount
      messages {
        ...contributionMessageFields
      }
      updatedBy
      moderatorId
    }
  }
}

query listAllContributions ($pagination: Paginated!, $filter: ContributionFilterArgs) {
  listAllContributions(pagination: $pagination, filter: $filter) {
    contributionCount
    windowMonths
    contributionList {
      id
      amount
      memo
      creationGroups {
        tag
        name
      }
      contributionDate
      updatedBy
      contributionStatus
    }
  }
}

query countContributionsInProgress {
  countContributionsInProgress
}

query openCreations {
  openCreations {
    year
    month
    amount
  }
}

query openCreationsAmounts {
  openCreations {
    amount
  }
}

# Group functions: canonical tag list (autocomplete) + the user's own list (main tag)
query creationGroups {
  creationGroups {
    id
    tag
    name
  }
}

# Only the groups the community list currently has something to show for. For the filter
# above that list — never for the submission field, which must keep offering every group so
# a dormant one can be woken up again.
query communityCreationGroups {
  communityCreationGroups {
    id
    tag
    name
  }
}

# Only the groups the caller's own "my contributions" list has something to show for, so the
# filter above that list never offers a group that would come back empty. Not windowed, and
# it counts deleted contributions too, because that list shows them.
query myContributionCreationGroups {
  myContributionCreationGroups {
    id
    tag
    name
  }
}

# What the group field is pre-filled with: the member's own last statement, derived from
# their history in the backend. Null means "(no group)" — either chosen deliberately last
# time, or nothing to go on.
query suggestedCreationGroup {
  suggestedCreationGroup {
    id
    tag
    name
  }
}

# return unconfirmedContributionFields
mutation createContribution ($amount: GradidoUnit!, $memo: String!, $contributionDate: String!, $creationGroups: [String!]) {
  createContribution(amount: $amount, memo: $memo, contributionDate: $contributionDate, creationGroups: $creationGroups)  {
    id
  }
}

# return unconfirmedContributionFields
mutation updateContribution (
  $contributionId: Int!,
  $amount: GradidoUnit!,
  $memo: String!,
  $contributionDate: String!
) {
  updateContribution(
    contributionId: $contributionId,
    amount: $amount,
    memo: $memo,
    contributionDate: $contributionDate
  ) {
    id
  }
}

mutation deleteContribution($id: Int!) {
  deleteContribution(id: $id)
}



