# AI-GENERATED — not an architecture reference

# One contact, whole. `user` is the same shape the booking fragment delivers, read by the
# same fields and under the same rule: no firstName/lastName (NU-019).
#
# ⛔ A fragment because TWO documents ask for a contact now -- the list, and the single
# lookup behind a contact window opened from a booking row. Both feed the SAME window, so a
# field asked for in one and forgotten in the other would leave that window drawing a
# person differently depending on where it was opened from, with every test still green:
# the mocked Apollo layer answers whatever a spec puts in it. The same reason
# `balanceFields` is one fragment, measured in balanceFields.spec.js.
fragment contactFields on Contact {
  user {
    communityUuid
    communityName
    gradidoID
    alias
    avatarColorIndex
    avatarUpdatedAt
  }
  firstAt
  lastAt
  # May be 0 since the referral trace became a second source: somebody who came here over
  # this member is a contact from that moment. Whoever renders it must not reach for a
  # plural rule with a 0 in it, nor link into a booking list that has nothing in it.
  bookings
  favorite
  # Whether this person belongs to the community this wallet serves -- answered by the
  # server, which compares community uuids. The wallet cannot answer it: it knows its
  # own community by a name out of its own configuration, while the name on a contact
  # was written from the backend's. See Contact.homeCommunity.
  homeCommunity
  # What made the two of them contacts where it was not a booking -- REFERRER for whoever
  # showed this member Gradido, ARRIVAL for whoever came here over them; null for a contact
  # out of the bookings. Asked for in the FRAGMENT, so the list and the single lookup behind
  # the window cannot come to know it in one place and not the other.
  origin
}

# Everyone this member has exchanged Gradido with, each once (KF-004).
query contactListQuery($currentPage: Int = 1, $pageSize: Int = 25, $search: String) {
  contactList(currentPage: $currentPage, pageSize: $pageSize, search: $search) {
    count
    contacts {
      ...contactFields
    }
  }
}

# ONE contact, asked for by the pair a booking row carries -- what the contact window needs
# when it is opened from the booking list or the column beside it (KF-010). The three
# figures it states (since when, how many, how recently) are a grouping over ALL bookings
# with that person and exist nowhere on a single row.
#
# ⚠️ `pageSize: 1` and the count is left unasked: the server has narrowed to one person, so
# the answer is that person or nobody, and "how many contacts matched" is not a question
# this screen has.
query contactByMemberQuery($ref: MemberAvatarRefInput!) {
  contactList(currentPage: 1, pageSize: 1, ref: $ref) {
    contacts {
      ...contactFields
    }
  }
}

# The member's hearts as uuid pairs -- fetched once per session and held beside the
# booking list, which is why the booking query needs no field for it (see useFavorites).
query favoriteListQuery {
  favoriteList {
    communityUuid
    gradidoID
  }
}

mutation addFavorite($ref: MemberAvatarRefInput!) {
  addFavorite(ref: $ref)
}

mutation removeFavorite($ref: MemberAvatarRefInput!) {
  removeFavorite(ref: $ref)
}
