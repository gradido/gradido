<!DOCTYPE html>
<html>
<head>
  <meta name="title" lang="de" content="<%= VITE_META_TITLE_DE %>">
  <meta name="title" lang="en" content="<%= VITE_META_TITLE_EN %>">
  <meta name="description" lang="de" content="<%= VITE_META_DESCRIPTION_DE %>">
  <meta name="description" lang="en" content="<%= VITE_META_DESCRIPTION_EN %>">
  <meta name="keywords" lang="de" content="<%= VITE_META_KEYWORDS_DE %>">
  <meta name="keywords" lang="en" content="<%= VITE_META_KEYWORDS_EN %>">
  <meta name="author" content="<%= VITE_META_AUTHOR %>">
  <meta name="url" content="<%= VITE_META_URL %>">
  <meta name="identifier-URL" content="<%= VITE_META_URL %>">
  <meta charset="utf-8">
  <meta name="robots" content="index,follow">
  <link rel='canonical' href='<%= VITE_META_URL %>'>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

  <!--
    Add to home screen. Without these the wallet is a bookmark with a picture: it opens inside
    the browser, shares its session and its permissions, and the camera asks again on every
    cold start. With them it is an app of its own -- which is what settles the camera question
    at a till, and gives back the height the browser bars take.

    start_url is /overview, NOT "/": "/" redirects to /login, and Login.vue does not check for
    an existing token, so the installed app would show the sign-in form on every launch even
    with a live session. /overview lets the router guard decide -- the account when signed in,
    the sign-in and back again when not.

    No service worker, on purpose. Chrome dropped it from the installability criteria (108 on
    mobile, 112 on desktop) and iOS never needed it. It would take over keeping the app fresh
    after a deploy -- a job installStaleChunkReload() and AppOutdatedBar already do, and both
    rest on "a reload always fetches index.html", which a caching worker makes false.

    viewport-fit stays at its default: keeping the safe area costs a strip in the theme colour
    and saves giving every page its own inset padding.
  -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/brand/app-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gradido">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!--
    ONE theme-color, and no media query on it. The wallet has three modes (system | light |
    dark) and the system mode already consults prefers-color-scheme inside that decision. A
    second, media-only rule here would be a second decider, and it would win for somebody who
    forced light on a dark phone: a dark status bar over a light page. So the value follows
    the decision that is already being made -- below, before first paint, and in App.vue
    afterwards. The two colours are the --bg design tokens (light _design-tokens.scss, dark
    gradido-template-dark.scss); webAppManifest.spec.js holds them against those files.
  -->
  <meta name="theme-color" content="#f5f5f5">

  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">

  <meta property="og:title" content="<%= VITE_META_TITLE_DE %>" />
  <meta property="og:description" content="<%= VITE_META_DESCRIPTION_DE %>" />
  <meta property="og:type" content="Website" />
  <meta property="og:url" content="<%= VITE_META_URL %>" />
  <meta property="og:image" content="<%= VITE_META_URL %>/img/gradido-wallet-650-400.jpg" />

  <meta lang="de" name="twitter:title" content="<%= VITE_META_TITLE_DE %>">
  <meta lang="en" name="twitter:title" content="<%= VITE_META_TITLE_EN %>">
  <meta lang="de" name="twitter:description" content="<%= VITE_META_DESCRIPTION_DE %>">
  <meta lang="en" name="twitter:description" content="<%= VITE_META_DESCRIPTION_EN %>">
  <meta name="twitter:image" content="<%= VITE_META_URL %>/img/gradido-wallet-650-400.jpg">
  <meta name="twitter:card" content="summary_large_image">

</head>
<body>
<script>
  // Apply the device-local theme before first paint to avoid a light flash
  // (FOUC) on a cold load while in dark mode. Mirrors the store's applyTheme:
  // dark when themeMode is 'dark', or 'system' (the default) and the OS is dark.
  // Runs before #app renders; the App.vue watcher then keeps body.dark-mode and
  // the data-bs-theme attribute in sync.
  //
  // This blocks the first paint, so it stays minimal: a single getItem of the
  // dedicated key (THEME_MODE_STORAGE_KEY in src/store/store.js, kept in sync by
  // applyTheme) instead of parsing the whole persisted-state blob, and matchMedia
  // only when the mode really is 'system'.
  //
  // Installed on a home screen the status bar takes its colour from theme-color, so
  // the same decision sets it here. Only the dark branch does work -- the tag in the
  // head already carries the light value, which is also the fallback if this throws.
  ;(function () {
    try {
      var mode = window.localStorage.getItem('gradido-theme-mode') || 'system'
      if (
        mode === 'dark' ||
        (mode === 'system' &&
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.body.classList.add('dark-mode')
        document.body.setAttribute('data-bs-theme', 'dark')
        var themeMeta = document.querySelector('meta[name="theme-color"]')
        if (themeMeta) themeMeta.setAttribute('content', '#17181a')
      }
    } catch (e) {}
  })()
</script>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
<!-- built files will be auto injected -->
</body>
</html>
