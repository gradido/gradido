<!DOCTYPE html>
<html>
<head>
  <!-- Title, description and keywords are the product's own words, the same on every server;
       only author and URL come from the server (vite.config.mjs). -->
  <meta name="title" lang="de" content="Gradido – Helfen. Schenken. Danken.">
  <meta name="title" lang="en" content="Gradido – Help. Give. Thank.">
  <meta name="description" lang="de" content="Ein Netzwerk von Menschen, die einander helfen, beschenken und danken. Kostenfrei. Gemeinschaftsbasiert. Open Source.">
  <meta name="description" lang="en" content="A network of people who help, give to and thank each other. Free of charge. Community-based. Open source.">
  <meta name="keywords" lang="de" content="Helfen, Schenken, Danken, Gemeinschaft, Nachbarschaft, Ehrenamt, Gemeinwohl, Dankbarkeit">
  <meta name="keywords" lang="en" content="Helping, Giving, Thanking, Community, Neighbourhood, Volunteering, Common Good, Gratitude">
  <meta name="author" content="<%= VITE_META_AUTHOR %>">
  <meta name="url" content="<%= VITE_META_URL %>">
  <meta name="identifier-URL" content="<%= VITE_META_URL %>">
  <meta charset="utf-8">
  <meta name="robots" content="index,follow">
  <link rel='canonical' href='<%= VITE_META_URL %>'>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

  <!--
    Add to home screen. Without these the wallet is a bookmark with a picture: it opens inside
    the browser, shares its session and its permissions, and the camera asks again on every
    cold start. With them it is an app of its own -- which is what settles the camera question
    at a till, and gives back the height the browser bars take.

    start_url is /overview, NOT "/": "/" redirects to /login, and Login.vue does not check for
    an existing token, so the installed app would show the sign-in form on every launch even
    with a live session. /overview lets the router guard decide -- the account when signed in,
    the sign-in and back again when not.

    No service worker, on purpose. Chrome dropped it from the installability criteria (108 on
    mobile, 112 on desktop) and iOS never needed it. It would take over keeping the app fresh
    after a deploy -- a job installStaleChunkReload(), newVersionCheck() and AppOutdatedBar
    already do, and all three rest on the server being reachable for index.html.

    ⛔ The third of those raises the stake, so anyone weighing a worker should read this first:
    newVersionCheck fetches index.html itself and compares the build it names with the one it
    is running. `cache: 'no-store'` governs the HTTP cache and does NOT bypass a worker's
    fetch handler -- so a caching worker would hand it a copy of its own index.html, the
    comparison would answer "nothing was deployed" for as long as the worker lived, and
    nothing would fail: no error, no failing test, just a wallet that never updates again.

    viewport-fit stays at its default: keeping the safe area costs a strip in the theme colour
    and saves giving every page its own inset padding.
  -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/brand/app-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gradido">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!--
    ONE theme-color, and no media query on it. The wallet has three modes (system | light |
    dark) and the system mode already consults prefers-color-scheme inside that decision. A
    second, media-only rule here would be a second decider, and it would win for somebody who
    forced light on a dark phone: a dark status bar over a light page. So the value follows
    the decision that is already being made -- below, before first paint, and in App.vue
    afterwards. The two colours are the --bg design tokens (light _design-tokens.scss, dark
    gradido-template-dark.scss); webAppManifest.spec.js holds them against those files.
  -->
  <meta name="theme-color" content="#f5f5f5">

  <!--
    The pages stand in Open Sans. Its Latin file is fetched beside the bundle, so that the
    first page of a first visit does not stand without its words while the stylesheet finds
    out it needs the file. `crossorigin` stays: without it the browser fetches the file twice,
    from our own address too.
  -->
  <link rel="preload" href="/fonts/open-sans/open-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

  <meta property="og:title" content="Gradido – Helfen. Schenken. Danken." />
  <meta property="og:description" content="Ein Netzwerk von Menschen, die einander helfen, beschenken und danken. Kostenfrei. Gemeinschaftsbasiert. Open Source." />
  <meta property="og:type" content="Website" />
  <meta property="og:url" content="<%= VITE_META_URL %>" />
  <meta property="og:image" content="<%= VITE_META_URL %>/img/gradido-preview-1200-630.jpg" />

  <meta lang="de" name="twitter:title" content="Gradido – Helfen. Schenken. Danken.">
  <meta lang="en" name="twitter:title" content="Gradido – Help. Give. Thank.">
  <meta lang="de" name="twitter:description" content="Ein Netzwerk von Menschen, die einander helfen, beschenken und danken. Kostenfrei. Gemeinschaftsbasiert. Open Source.">
  <meta lang="en" name="twitter:description" content="A network of people who help, give to and thank each other. Free of charge. Community-based. Open source.">
  <meta name="twitter:image" content="<%= VITE_META_URL %>/img/gradido-preview-1200-630.jpg">
  <meta name="twitter:card" content="summary_large_image">

</head>
<body>
<script>
  // Apply the device-local theme before first paint to avoid a light flash
  // (FOUC) on a cold load while in dark mode. 
  ;(function () {
    try {
      var mode = window.localStorage.getItem('gradido-theme-mode') || 'system'
      if (
        mode === 'dark' ||
        (mode === 'system' &&
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.body.classList.add('dark-mode')
        document.body.setAttribute('data-bs-theme', 'dark')
        var themeMeta = document.querySelector('meta[name="theme-color"]')
        if (themeMeta) themeMeta.setAttribute('content', '#17181a')
      }
    } catch (e) {}
  })()
</script>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
<!-- built files will be auto injected -->
</body>
</html>
